services:
  - type: web
    name: edulove-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: your-secret-key-here-change-in-production
      - key: FRONTEND_URL
        fromQuery: FRONTEND_URL
      - key: BACKEND_URL
        fromQuery: BACKEND_URL
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PORT
        value: "5000"

  - type: web
    name: edulove-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve -s build -l 3000
    envVars:
      - key: REACT_APP_API_URL
        fromQuery: API_URL
      - key: NODE_ENV
        value: production
