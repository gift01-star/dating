services:
  - type: web
    name: edulove-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: your-secret-key-here-change-in-production
      - key: FRONTEND_URL
        fromQuery: FRONTEND_URL
      - key: BACKEND_URL
        fromQuery: BACKEND_URL
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PORT
        value: "5000"

  - type: web
    name: edulove-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    # Use the application's production Node server so built assets are served
    # with correct MIME types and the SPA fallback works.
    startCommand: cd frontend && npm run start:prod
    envVars:
      - key: REACT_APP_API_URL
        fromQuery: API_URL
      - key: FRONTEND_URL
        fromQuery: FRONTEND_URL
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
